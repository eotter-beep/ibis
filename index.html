<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ibis</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#08080d;--bg2:#101018;--bg3:#181826;
      --gold:#d4a843;--gold2:#b88c2e;
      --text:#ede9e0;--muted:#7a7870;
    }
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;min-height:100vh;overflow-x:hidden}

    nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1.1rem 2.5rem;background:linear-gradient(to bottom,rgba(8,8,13,.96) 0%,transparent 100%)}
    .logo{font-family:'Playfair Display',serif;font-size:1.6rem;color:var(--gold);text-decoration:none;letter-spacing:.05em}
    .nav-links{display:flex;gap:2rem;list-style:none}
    .nav-links a{color:var(--text);text-decoration:none;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;opacity:.65;transition:opacity .2s;cursor:pointer}
    .nav-links a:hover{opacity:1}
    .nav-right{display:flex;gap:.75rem;align-items:center}
    .btn-ghost{background:transparent;color:var(--text);border:1px solid rgba(237,233,224,.22);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;padding:.5rem 1.2rem;transition:border-color .2s,background .2s}
    .btn-ghost:hover{border-color:var(--gold);background:rgba(212,168,67,.07)}

    #search-wrap{display:none;padding:5.5rem 2.5rem 1.5rem}
    #search-wrap.open{display:block}
    #search-input{width:100%;background:var(--bg3);border:1px solid rgba(255,255,255,.1);color:var(--text);padding:.9rem 1.4rem;font-family:'DM Sans',sans-serif;font-size:1rem;outline:none;transition:border-color .2s}
    #search-input:focus{border-color:var(--gold)}
    #search-input::placeholder{color:var(--muted)}
    #search-grid{display:flex;flex-wrap:wrap;gap:1rem;margin-top:1.5rem}

    #hero{height:88vh;position:relative;display:flex;align-items:flex-end;padding:0 2.5rem 4.5rem;overflow:hidden}
    .hero-bg{position:absolute;inset:0;background:linear-gradient(to right,rgba(8,8,13,.96) 30%,rgba(8,8,13,.25) 100%),linear-gradient(to top,rgba(8,8,13,.92) 0%,transparent 55%);z-index:1}
    #hero-art{position:absolute;inset:0;width:100%;height:100%}
    .hero-content{position:relative;z-index:2;max-width:540px}
    .hero-tag{display:inline-block;font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold2);padding:.28rem .75rem;margin-bottom:1.1rem}
    .hero-title{font-family:'Playfair Display',serif;font-size:clamp(2.2rem,5vw,3.6rem);line-height:1.08;margin-bottom:.85rem}
    .hero-meta{display:flex;gap:1rem;font-size:.78rem;color:var(--muted);margin-bottom:1rem;align-items:center}
    .hero-star{color:var(--gold);font-weight:500}
    .hero-desc{font-size:.88rem;line-height:1.7;color:rgba(237,233,224,.68);margin-bottom:1.75rem;max-width:400px}
    .hero-btns{display:flex;gap:.9rem}
    .btn-play{display:flex;align-items:center;gap:.55rem;background:var(--text);color:#08080d;border:none;padding:.7rem 1.75rem;font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:500;cursor:pointer;transition:background .2s}
    .btn-play:hover{background:var(--gold)}
    .btn-more{display:flex;align-items:center;gap:.55rem;background:rgba(255,255,255,.12);color:var(--text);border:none;padding:.7rem 1.75rem;font-family:'DM Sans',sans-serif;font-size:.85rem;cursor:pointer;transition:background .2s}
    .btn-more:hover{background:rgba(255,255,255,.2)}

    .section{padding:1.75rem 2.5rem}
    .section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1.1rem}
    .section-title{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:400}
    .section-note{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

    .row{display:flex;gap:.9rem;overflow-x:auto;padding-bottom:.75rem;scroll-snap-type:x mandatory;scrollbar-width:none}
    .row::-webkit-scrollbar{display:none}
    .card{flex:0 0 170px;scroll-snap-align:start;cursor:pointer;position:relative;transition:transform .25s}
    .card:hover{transform:scale(1.06) translateY(-5px);z-index:5}
    .card-art{width:100%;aspect-ratio:2/3;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:.6rem;position:relative;overflow:hidden}
    .card-year-badge{position:absolute;top:.5rem;right:.5rem;font-size:.65rem;background:rgba(0,0,0,.55);padding:.2rem .45rem;color:var(--muted);letter-spacing:.05em}
    .card-label{position:relative;z-index:1;width:100%;text-align:center}
    .card-name{font-size:.78rem;font-weight:500;line-height:1.3;color:#fff}
    .card-genre{font-size:.65rem;color:rgba(255,255,255,.5);margin-top:.2rem}
    .card-hover-bar{position:absolute;bottom:0;left:0;right:0;background:rgba(8,8,13,.92);padding:.6rem .7rem;transform:translateY(100%);transition:transform .22s;z-index:2}
    .card:hover .card-hover-bar{transform:translateY(0)}
    .card-play-icon{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--gold);margin-bottom:.3rem}
    .card-hover-title{font-size:.75rem;font-weight:500;line-height:1.3}
    .card-hover-meta{font-size:.65rem;color:var(--muted);margin-top:.15rem}

    #modal-bg{display:none;position:fixed;inset:0;background:rgba(4,4,8,.88);z-index:200;align-items:center;justify-content:center}
    #modal-bg.open{display:flex}
    #modal{background:var(--bg2);width:90%;max-width:660px;max-height:88vh;overflow-y:auto;position:relative}
    .modal-art{width:100%;height:240px;display:flex;align-items:center;justify-content:flex-end;padding:1.5rem;position:relative;overflow:hidden}
    .modal-art-bg{position:absolute;inset:0}
    .modal-art-overlay{position:absolute;inset:0;background:linear-gradient(to right,rgba(8,8,13,.85) 30%,transparent);z-index:1}
    .modal-art-title{position:relative;z-index:2;font-family:'Playfair Display',serif;font-size:2rem;max-width:280px;line-height:1.1;text-align:right}
    .modal-body{padding:1.5rem 2rem 2rem}
    .modal-meta-row{display:flex;gap:1.2rem;font-size:.8rem;color:var(--muted);margin-bottom:1rem;align-items:center;flex-wrap:wrap}
    .modal-star{color:var(--gold);font-weight:500}
    .modal-genres{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem}
    .pill{font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(212,168,67,.3);padding:.22rem .65rem}
    .modal-desc{font-size:.88rem;line-height:1.72;color:rgba(237,233,224,.72);margin-bottom:1.5rem}
    .modal-actions{display:flex;gap:.8rem}
    .modal-close{position:absolute;top:.9rem;right:.9rem;width:32px;height:32px;background:rgba(8,8,13,.7);border:1px solid rgba(255,255,255,.15);color:var(--text);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10}
    .modal-close:hover{border-color:var(--gold)}

    #player-wrap{display:none;position:fixed;inset:0;background:#000;z-index:300;flex-direction:column}
    #player-wrap.open{display:flex}
    .player-bar{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.75rem;background:linear-gradient(to bottom,rgba(0,0,0,.8),transparent);position:absolute;top:0;left:0;right:0;z-index:10}
    .player-bar-title{font-family:'Playfair Display',serif;font-size:1rem}
    .player-exit{background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;padding:.38rem .95rem;font-family:'DM Sans',sans-serif;font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;cursor:pointer;transition:border-color .2s}
    .player-exit:hover{border-color:var(--gold)}
    #player-container{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
    #player-container .plyr{width:100%;max-height:100vh}

    .plyr--video .plyr__control:hover,.plyr--video .plyr__control[aria-expanded=true]{background:var(--gold)!important}
    .plyr--full-ui input[type=range]{color:var(--gold)!important}
    .plyr__control--overlaid{background:rgba(212,168,67,.85)!important}
    .plyr__control--overlaid:hover{background:var(--gold)!important}

    footer{margin-top:3rem;padding:2rem 2.5rem;border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between}
    .footer-logo{font-family:'Playfair Display',serif;color:var(--gold);font-size:1.15rem}
    .footer-note{font-size:.75rem;color:var(--muted)}

    @media(max-width:700px){
      nav{padding:1rem 1.25rem}
      .nav-links{display:none}
      #hero{padding:0 1.25rem 3rem}
      .section{padding:1.25rem}
      footer{flex-direction:column;gap:.75rem}
    }
  </style>
</head>
<body>

<nav>
  <a class="logo" href="#">Ibis</a>
  <ul class="nav-links">
    <li><a onclick="scrollToSection('all-section')">All Films</a></li>
    <li><a onclick="scrollToSection('horror-section')">Horror</a></li>
    <li><a onclick="scrollToSection('comedy-section')">Comedy</a></li>
    <li><a onclick="scrollToSection('silent-section')">Silent Era</a></li>
  </ul>
  <div class="nav-right">
    <button class="btn-ghost" onclick="toggleSearch()">&#x2315; Search</button>
  </div>
</nav>

<div id="search-wrap">
  <input id="search-input" type="text" placeholder="Search by title, director, genre, year…" oninput="doSearch(this.value)">
  <div id="search-grid"></div>
</div>

<section id="hero">
  <div class="hero-bg"></div>
  <canvas id="hero-art"></canvas>
  <div class="hero-content">
    <div class="hero-tag">&#9733; Featured Film</div>
    <h1 class="hero-title" id="h-title"></h1>
    <div class="hero-meta" id="h-meta"></div>
    <p class="hero-desc" id="h-desc"></p>
    <div class="hero-btns">
      <button class="btn-play" id="h-play">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="currentColor"><polygon points="2,1 13,7 2,13"/></svg>
        Play Now
      </button>
      <button class="btn-more" id="h-more">&#9432; More Info</button>
    </div>
  </div>
</section>

<main>
  <section class="section" id="all-section">
    <div class="section-head">
      <h2 class="section-title">All Films</h2>
      <span class="section-note">Public Domain</span>
    </div>
    <div class="row" id="all-row"></div>
  </section>

  <section class="section" id="horror-section">
    <div class="section-head"><h2 class="section-title">Horror &amp; Sci-Fi</h2></div>
    <div class="row" id="horror-row"></div>
  </section>

  <section class="section" id="comedy-section">
    <div class="section-head"><h2 class="section-title">Comedy &amp; Romance</h2></div>
    <div class="row" id="comedy-row"></div>
  </section>

  <section class="section" id="silent-section">
    <div class="section-head"><h2 class="section-title">Silent Era</h2></div>
    <div class="row" id="silent-row"></div>
  </section>
</main>

<div id="modal-bg" onclick="closeMaybe(event)">
  <div id="modal">
    <button class="modal-close" onclick="closeModal()">&#10005;</button>
    <div class="modal-art">
      <div class="modal-art-bg" id="m-art-bg"></div>
      <div class="modal-art-overlay"></div>
      <div class="modal-art-title" id="m-art-title"></div>
    </div>
    <div class="modal-body">
      <div class="modal-meta-row" id="m-meta"></div>
      <div class="modal-genres" id="m-genres"></div>
      <p class="modal-desc" id="m-desc"></p>
      <div class="modal-actions">
        <button class="btn-play" id="m-play">
          <svg width="12" height="12" viewBox="0 0 14 14" fill="currentColor"><polygon points="2,1 13,7 2,13"/></svg>
          Play
        </button>
        <button class="btn-ghost" onclick="closeModal()">Close</button>
      </div>
    </div>
  </div>
</div>

<div id="player-wrap">
  <div class="player-bar">
    <span class="player-bar-title" id="player-title-text"></span>
    <button class="player-exit" onclick="closePlayer()">&#10005; Exit</button>
  </div>
  <div id="player-container">
    <video id="plyr-video" playsinline controls crossorigin="anonymous"></video>
  </div>
</div>

<footer>
  <span class="footer-logo">Ibis</span>
  <span class="footer-note">All films are confirmed public domain — free to stream &amp; share</span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.min.js"></script>
<script>
const FILMS = [
  {
    title:"Night of the Living Dead",year:1968,rating:7.9,runtime:"1h 36m",
    genres:["Horror","Sci-Fi"],director:"George A. Romero",
    desc:"A ragtag group of survivors barricade themselves in a farmhouse as the recently dead rise and begin to prey on the living. Romero's landmark film invented the modern zombie genre and remains a masterpiece of dread.",
    src:"https://archive.org/download/night_of_the_living_dead_dvd/Night.mp4",
    c1:"#1a0a0a",c2:"#3a1010",sections:["horror","all"]
  },
  {
    title:"His Girl Friday",year:1940,rating:7.9,runtime:"1h 32m",
    genres:["Comedy","Romance"],director:"Howard Hawks",
    desc:"Cary Grant and Rosalind Russell in Howard Hawks' blazing screwball comedy — a scheming newspaper editor tries every trick to keep his ace reporter ex-wife from remarrying. Famous for its lightning-fast overlapping dialogue.",
    src:"https://archive.org/download/his_girl_friday/his_girl_friday_512kb.mp4",
    c1:"#0a1a2a",c2:"#103050",sections:["comedy","all"]
  },
  {
    title:"Nosferatu",year:1922,rating:7.9,runtime:"1h 34m",
    genres:["Horror","Silent"],director:"F.W. Murnau",
    desc:"The unauthorised Dracula adaptation that defined the vampire in cinema forever. Murnau's expressionist nightmare stars Max Schreck as the harrowing Count Orlok in one of film history's most enduring images.",
    src:"https://archive.org/download/Nosferatu1922HD/Nosferatu%20%281922%29.mp4",
    c1:"#0a0a1a",c2:"#151530",sections:["horror","silent","all"]
  },
  {
    title:"The Phantom of the Opera",year:1925,rating:7.6,runtime:"1h 33m",
    genres:["Horror","Silent"],director:"Rupert Julian",
    desc:"Lon Chaney's towering performance as the disfigured musical genius who haunts the Paris Opera House. One of the great silent horror films — the unmasking scene remains one of cinema's most shocking moments.",
    src:"https://archive.org/download/ThePhantomoftheOpera/The.Phantom.of.the.Opera.1925.avi",
    c1:"#1a100a",c2:"#352010",sections:["horror","silent","all"]
  },
  {
    title:"The General",year:1926,rating:8.1,runtime:"1h 19m",
    genres:["Comedy","Silent","Action"],director:"Buster Keaton",
    desc:"Buster Keaton at the height of his powers — a Confederate train engineer chases Union soldiers who've stolen his locomotive. Considered one of the greatest films ever made, with breathtaking practical stunts.",
    src:"https://archive.org/download/TheGeneral_20/TheGeneral.mp4",
    c1:"#101a10",c2:"#203520",sections:["comedy","silent","all"]
  },
  {
    title:"Charade",year:1963,rating:7.9,runtime:"1h 53m",
    genres:["Thriller","Comedy","Romance"],director:"Stanley Donen",
    desc:"Audrey Hepburn and Cary Grant in a sparkling Hitchcock-style thriller set in Paris. A widow is pursued by several dangerous men all after a quarter million dollars her dead husband had hidden.",
    src:"https://archive.org/download/Charade1963/Charade%201963.mp4",
    c1:"#1a1a0a",c2:"#303020",sections:["comedy","all"]
  },
  {
    title:"The Last Man on Earth",year:1964,rating:6.9,runtime:"1h 26m",
    genres:["Horror","Sci-Fi"],director:"Sidney Salkow",
    desc:"Vincent Price as the sole survivor of a plague that has turned humanity into vampire-like creatures. The original adaptation of Richard Matheson's I Am Legend — bleak, atmospheric, and ahead of its time.",
    src:"https://archive.org/download/TheLastManOnEarth_201/TheLastManOnEarth.mp4",
    c1:"#1a1204",c2:"#2a1e08",sections:["horror","all"]
  },
  {
    title:"Safety Last!",year:1923,rating:8.1,runtime:"1h 14m",
    genres:["Comedy","Silent","Action"],director:"Fred C. Newmeyer",
    desc:"Harold Lloyd's defining film, featuring the iconic clock-hanging stunt that became one of cinema's most recognisable images. A department store clerk's get-rich scheme spirals hilariously out of control.",
    src:"https://archive.org/download/SafetyLast/SafetyLast.mp4",
    c1:"#0f1520",c2:"#1a2535",sections:["comedy","silent","all"]
  },
  {
    title:"Plan 9 from Outer Space",year:1957,rating:4.0,runtime:"1h 19m",
    genres:["Sci-Fi","Horror"],director:"Ed Wood",
    desc:"Aliens resurrect the dead to stop humanity from building a doomsday weapon. Ed Wood's gloriously inept cult classic — arguably the most beloved bad movie ever made, now a cornerstone of camp cinema.",
    src:"https://archive.org/download/plan_9_from_outer_space/plan_9_from_outer_space_512kb.mp4",
    c1:"#0d0d1f",c2:"#15153a",sections:["horror","all"]
  },
  {
    title:"Little Shop of Horrors",year:1960,rating:6.5,runtime:"1h 12m",
    genres:["Comedy","Horror"],director:"Roger Corman",
    desc:"Roger Corman's quickie cult classic filmed in two days — a clumsy florist cultivates a carnivorous plant with a taste for human blood. Features an early Jack Nicholson cameo and a wonderfully absurd premise.",
    src:"https://archive.org/download/Little_Shop_of_Horrors_1960/Little_Shop_of_Horrors_1960_512kb.mp4",
    c1:"#0a1f0a",c2:"#123512",sections:["horror","comedy","all"]
  }
];

// Hero
const ALL_FILMS = [...FILMS];
const CURATED_ALL = [...ALL_FILMS].sort((a,b)=>a.rating-b.rating || a.year-b.year);
const HERO = CURATED_ALL[Math.floor(CURATED_ALL.length/2)];
(function(){
  document.getElementById('h-title').textContent = HERO.title;
  document.getElementById('h-meta').innerHTML =
    `<span class="hero-star">&#9733; ${HERO.rating}</span><span>${HERO.year}</span><span>${HERO.runtime}</span><span>${HERO.genres[0]}</span>`;
  document.getElementById('h-desc').textContent = HERO.desc;
  document.getElementById('h-play').onclick = () => openPlayer(HERO);
  document.getElementById('h-more').onclick = () => openModal(HERO);

  const c = document.getElementById('hero-art');
  c.style.cssText = 'position:absolute;inset:0;width:100%;height:100%';
  const ctx = c.getContext('2d');
  function draw(){
    c.width=c.offsetWidth; c.height=c.offsetHeight;
    const g=ctx.createLinearGradient(0,0,c.width,c.height);
    g.addColorStop(0,HERO.c2); g.addColorStop(.6,HERO.c1); g.addColorStop(1,'#08080d');
    ctx.fillStyle=g; ctx.fillRect(0,0,c.width,c.height);
    ctx.strokeStyle='rgba(212,168,67,.06)'; ctx.lineWidth=1;
    for(let i=0;i<14;i++){
      ctx.beginPath();
      ctx.moveTo(Math.random()*c.width,0);
      ctx.bezierCurveTo(Math.random()*c.width,c.height*.35,Math.random()*c.width,c.height*.65,Math.random()*c.width,c.height);
      ctx.stroke();
    }
  }
  draw(); window.addEventListener('resize',draw);
})();

// Cards
function makeCard(f){
  const d=document.createElement('div');
  d.className='card';
  d.innerHTML=`<div class="card-art" style="background:linear-gradient(160deg,${f.c2} 0%,${f.c1} 100%)">
    <div class="card-year-badge">${f.year}</div>
    <div class="card-label">
      <div class="card-name">${f.title}</div>
      <div class="card-genre">${f.genres[0]}</div>
    </div>
    <div class="card-hover-bar">
      <div class="card-play-icon"><svg width="10" height="10" viewBox="0 0 14 14" fill="#08080d"><polygon points="2,1 13,7 2,13"/></svg></div>
      <div class="card-hover-title">${f.title}</div>
      <div class="card-hover-meta">&#9733; ${f.rating} &nbsp;·&nbsp; ${f.runtime}</div>
    </div>
  </div>`;
  d.onclick=()=>openModal(f);
  return d;
}

function fillRow(id,films){ const r=document.getElementById(id); r.innerHTML=''; films.forEach(f=>r.appendChild(makeCard(f))); }
fillRow('all-row',CURATED_ALL);
fillRow('horror-row',ALL_FILMS.filter(f=>f.sections.includes('horror')));
fillRow('comedy-row',ALL_FILMS.filter(f=>f.sections.includes('comedy')));
fillRow('silent-row',ALL_FILMS.filter(f=>f.sections.includes('silent')));

// Modal
function openModal(f){
  document.getElementById('m-art-bg').style.background=`linear-gradient(135deg,${f.c2} 0%,${f.c1} 100%)`;
  document.getElementById('m-art-title').textContent=f.title;
  document.getElementById('m-meta').innerHTML=`<span class="modal-star">&#9733; ${f.rating}</span><span>${f.year}</span><span>${f.runtime}</span><span>${f.director}</span>`;
  document.getElementById('m-genres').innerHTML=f.genres.map(g=>`<span class="pill">${g}</span>`).join('');
  document.getElementById('m-desc').textContent=f.desc;
  document.getElementById('m-play').onclick=()=>{closeModal();openPlayer(f);};
  document.getElementById('modal-bg').classList.add('open');
}
function closeModal(){ document.getElementById('modal-bg').classList.remove('open'); }
function closeMaybe(e){ if(e.target===document.getElementById('modal-bg')) closeModal(); }

// Player
let player=null;
function openPlayer(f){
  document.getElementById('player-title-text').textContent=f.title;
  const vid=document.getElementById('plyr-video');
  if(!player){
    vid.src=f.src;
    player=new Plyr('#plyr-video',{
      controls:['play-large','play','progress','current-time','duration','mute','volume','captions','fullscreen'],
      keyboard:{focused:true,global:true}
    });
  } else {
    player.source={type:'video',sources:[{src:f.src}]};
  }
  document.getElementById('player-wrap').classList.add('open');
  setTimeout(()=>{ try{player.play();}catch(e){} },400);
}
function closePlayer(){
  document.getElementById('player-wrap').classList.remove('open');
  try{player.pause();}catch(e){}
}

// Search
function toggleSearch(){
  const w=document.getElementById('search-wrap');
  w.classList.toggle('open');
  if(w.classList.contains('open')) document.getElementById('search-input').focus();
}
function doSearch(q){
  const g=document.getElementById('search-grid');
  g.innerHTML='';
  if(!q.trim()) return;
  const hits=FILMS.filter(f=>
    f.title.toLowerCase().includes(q.toLowerCase())||
    f.genres.some(x=>x.toLowerCase().includes(q.toLowerCase()))||
    f.director.toLowerCase().includes(q.toLowerCase())||
    String(f.year).includes(q)
  );
  if(!hits.length){ const msg=document.createElement('p'); msg.style.cssText='color:var(--muted);font-size:.88rem'; msg.textContent=`No results for "${q}"`; g.appendChild(msg); return; }
  hits.forEach(f=>g.appendChild(makeCard(f)));
}

// Nav scroll
function scrollToSection(id){ document.getElementById(id).scrollIntoView({behavior:'smooth'}); }

document.addEventListener('keydown',e=>{ if(e.key==='Escape'){closeModal();closePlayer();} });
